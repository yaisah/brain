<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" class="dg" viewBox="0 0 1000 600" role="img" aria-label="System overview: an agent host loads the public toolkit (entry points, skills, Python helpers, templates), which reads and writes a private brain made of a shared root and per-workspace folders."><style>
:root {
  color-scheme: light;
  --surface:#FFFFFF; --raised:#F4F6F9; --ink:#18222D; --muted:#5A6676;
  --line:#D3DAE2; --wire:#7B8796;
  --pub:#2D4CC0; --pub-tint:#EDF1FD; --pub-edge:#9DAEE8;
  --prv:#94560A; --prv-tint:#FCF3E6; --prv-edge:#E1B775;
  --f-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface:#131A21; --raised:#1A232C; --ink:#E3E9EF; --muted:#97A3B0;
    --line:#2B3642; --wire:#6F7D8C;
    --pub:#93AAFF; --pub-tint:#18213F; --pub-edge:#3D5099;
    --prv:#EDB46A; --prv-tint:#2A2014; --prv-edge:#7B5B2D;
  }
}

.dg text{font-family:var(--f-sans);font-weight:500}
.d-bg{fill:var(--surface)}
.d-frame{fill:none;stroke:var(--line);stroke-width:1}
.d-n{fill:var(--raised);stroke:var(--line);stroke-width:1}
.d-pub{fill:var(--pub-tint);stroke:var(--pub-edge);stroke-width:1}
.d-prv{fill:var(--prv-tint);stroke:var(--prv-edge);stroke-width:1}
.d-ext{fill:var(--surface);stroke:var(--wire);stroke-width:1.2;stroke-dasharray:5 4}
.d-zpub{fill:none;stroke:var(--pub-edge);stroke-width:1.3;stroke-dasharray:3 4}
.d-zprv{fill:none;stroke:var(--prv-edge);stroke-width:1.3;stroke-dasharray:3 4}
.d-bpub{fill:var(--pub-tint)}
.d-bprv{fill:var(--prv-tint)}
.d-bn{fill:var(--raised)}
.d-chip{fill:var(--surface);stroke:var(--line);stroke-width:1}
.d-chpub{fill:var(--surface);stroke:var(--pub-edge);stroke-width:1}
.d-chprv{fill:var(--surface);stroke:var(--prv-edge);stroke-width:1}
.d-chext{fill:var(--surface);stroke:var(--wire);stroke-width:1;stroke-dasharray:4 3}
.d-dot{fill:var(--ink)}
.dg .d-h{fill:var(--ink);font-size:16px;font-weight:600}
.dg .d-t{fill:var(--ink);font-size:14.5px}
.dg .d-s{fill:var(--muted);font-size:13px}
.dg .d-m{fill:var(--ink);font-family:var(--f-mono);font-size:13.5px;font-weight:400}
.dg .d-ms{fill:var(--muted);font-family:var(--f-mono);font-size:12.5px;font-weight:400}
.dg .d-k{font-size:11.5px;font-weight:600;letter-spacing:.09em}
.dg .d-num{fill:var(--surface);font-size:13px;font-weight:600}
.dg .d-lab{fill:var(--muted);font-size:12.5px;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.dg .f-s{font-family:var(--f-sans);font-size:12.5px;font-weight:500}
.dg .c-pub{fill:var(--pub)}
.dg .c-prv{fill:var(--prv)}
.dg .c-mut{fill:var(--muted)}
.dg .c-ink{fill:var(--ink)}
.d-w{fill:none;stroke:var(--wire);stroke-width:1.5}
.d-wd{stroke-dasharray:5 4}
.d-wpub{stroke:var(--pub)}
.d-wprv{stroke:var(--prv)}
.d-ah{fill:var(--wire)}
.d-ahpub{fill:var(--pub)}
.d-ahprv{fill:var(--prv)}
.d-fpub{fill:var(--pub)}
.d-fprv{fill:var(--prv)}
.d-fmut{fill:var(--wire)}</style><defs><marker id="overview-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ah"/></marker><marker id="overview-ahpub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ahpub"/></marker><marker id="overview-ahprv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ahprv"/></marker></defs><rect x="0.5" y="0.5" width="999" height="599" rx="12" class="d-bg"/><rect x="20" y="24" width="112" height="60" rx="8" class="d-n"/><text x="36" y="51" class="d-h">You</text><text x="36" y="72" class="d-s">asks &amp; reviews</text><rect x="172" y="24" width="328" height="60" rx="8" class="d-ext"/><text x="188" y="51" class="d-h">Agent host</text><text x="188" y="72" class="d-s">Claude Code, Codex, or similar</text><rect x="640" y="24" width="340" height="60" rx="8" class="d-ext"/><text x="656" y="51" class="d-h">Connectors &amp; schedulers</text><text x="656" y="72" class="d-s">optional · host-managed · off by default</text><path d="M132,54 L170,54" class="d-w" marker-end="url(#overview-ah)"/><path d="M640,54 L502,54" class="d-w d-wd" marker-end="url(#overview-ah)"/><text x="571" y="46" class="d-lab" text-anchor="middle">approved items</text><rect x="20" y="112" width="960" height="214" rx="12" class="d-zpub"/><text x="40" y="312" class="d-k c-pub">PUBLIC TOOLKIT · SHIPS TO GITHUB</text><rect x="40" y="130" width="206" height="156" rx="8" class="d-pub"/><text x="56" y="157" class="d-h">Entry points</text><text x="56" y="178" class="d-s">read before private files</text><text x="56" y="204" class="d-m">AGENTS.md</text><text x="56" y="226" class="d-m">CLAUDE.md</text><text x="56" y="248" class="d-m">OPERATING_GUIDE.md</text><text x="56" y="270" class="d-m" xml:space="preserve"><tspan class="c-ink">.brain</tspan><tspan class="c-mut">  brain:2</tspan></text><rect x="278" y="130" width="206" height="156" rx="8" class="d-pub"/><text x="294" y="157" class="d-h">Skills</text><text x="294" y="178" class="d-s">core + optional methods</text><text x="294" y="204" class="d-m">skills/</text><text x="294" y="226" class="d-m">optional-skills/</text><text x="294" y="248" class="d-m">capabilities.json</text><rect x="516" y="130" width="206" height="156" rx="8" class="d-pub"/><text x="532" y="157" class="d-h">Python helpers</text><text x="532" y="178" class="d-s">scripts/ · optional exports</text><text x="532" y="204" class="d-m">brain.py</text><text x="532" y="226" class="d-m">intake.py</text><text x="532" y="248" class="d-m">source_catalog.py</text><text x="532" y="270" class="d-m">artifacts.py</text><rect x="754" y="130" width="206" height="156" rx="8" class="d-pub"/><text x="770" y="157" class="d-h">Templates &amp; docs</text><text x="770" y="178" class="d-s">blank scaffolds</text><text x="770" y="204" class="d-m">templates/root/</text><text x="770" y="226" class="d-m">templates/project/</text><text x="770" y="248" class="d-m">templates/workflows/</text><text x="770" y="270" class="d-m">docs/  examples/</text><path d="M200,84 L200,128" class="d-w" marker-end="url(#overview-ah)"/><text x="208" y="107" class="d-lab">loads rules</text><path d="M440,84 L440,128" class="d-w" marker-end="url(#overview-ah)"/><text x="448" y="107" class="d-lab">runs skills</text><path d="M484,208 L514,208" class="d-w" marker-end="url(#overview-ah)"/><text x="499" y="199" class="d-lab" text-anchor="middle">call</text><rect x="20" y="366" width="960" height="214" rx="12" class="d-zprv"/><text x="40" y="566" class="d-k c-prv">PRIVATE BRAIN · GITIGNORED, NEVER RELEASED</text><rect x="40" y="384" width="430" height="160" rx="8" class="d-prv"/><text x="56" y="411" class="d-h">Workspaces</text><text x="180" y="411" class="d-ms">Projects/&lt;slug&gt;/</text><rect x="56" y="428" width="124" height="56" rx="6" class="d-chprv"/><text x="68" y="451" class="d-m">studio-a</text><text x="68" y="472" class="d-s">business</text><rect x="192" y="428" width="124" height="56" rx="6" class="d-chprv"/><text x="204" y="451" class="d-m">career-lab</text><text x="204" y="472" class="d-s">career</text><rect x="328" y="428" width="124" height="56" rx="6" class="d-chprv"/><text x="340" y="451" class="d-m">field-notes</text><text x="340" y="472" class="d-s">research</text><text x="56" y="520" class="d-s">each: context · STORY · Ingestion · wiki · outputs</text><rect x="502" y="384" width="458" height="160" rx="8" class="d-prv"/><text x="518" y="411" class="d-h">Shared root</text><text x="518" y="444" class="d-m" xml:space="preserve"><tspan class="c-ink">registry.json</tspan><tspan class="f-s c-mut"> workspaces</tspan></text><text x="518" y="469" class="d-m" xml:space="preserve"><tspan class="c-ink">integrations.json</tspan><tspan class="f-s c-mut"> routes</tspan></text><text x="518" y="494" class="d-m" xml:space="preserve"><tspan class="c-ink">context/</tspan><tspan class="f-s c-mut"> goals, capacity</tspan></text><text x="518" y="519" class="d-m" xml:space="preserve"><tspan class="c-ink">INDEX.md</tspan><tspan class="f-s c-mut"> directory</tspan></text><text x="736" y="444" class="d-m" xml:space="preserve"><tspan class="c-ink">raw/</tspan><tspan class="f-s c-mut"> originals</tspan></text><text x="736" y="469" class="d-m" xml:space="preserve"><tspan class="c-ink">inbox/</tspan><tspan class="f-s c-mut"> unrouted</tspan></text><text x="736" y="494" class="d-m" xml:space="preserve"><tspan class="c-ink">maintenance/</tspan><tspan class="f-s c-mut"> receipts, runs</tspan></text><text x="736" y="519" class="d-m" xml:space="preserve"><tspan class="c-ink">outputs/</tspan><tspan class="f-s c-mut"> plans, reports</tspan></text><path d="M381,286 L381,382" class="d-w" marker-end="url(#overview-ah)"/><text x="389" y="351" class="d-lab">reads context · writes notes</text><path d="M619,286 L619,382" class="d-w" marker-end="url(#overview-ah)"/><text x="627" y="351" class="d-lab">capture · receipts · registry</text><path d="M857,286 L857,382" class="d-w d-wd" marker-end="url(#overview-ah)"/><text x="865" y="351" class="d-lab">scaffolds</text></svg>
